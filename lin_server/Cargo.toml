[package]
name = "lin_server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6.10"
actix-web = "4.13.0"
actix-ws = "0.4.0"

futures-util = "0.3.32"
tokio = {version = "1.49.0", features = ["rt", "time", "macros"] }

serde = "1.0"
serde_json = "1.0"

# sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
diesel = { version = "2.2.0", features = ["chrono", "postgres"] }
dotenvy = "0.15"

rand = "0.10.0"
chrono = { version = "0.4", features = ["serde"] }

env_logger = "0.11.9"
log = "0.4.29"

lapin = "4.3.0"